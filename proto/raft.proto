syntax = "proto3";

package raftkv.rpc;

message Command {
  enum Type {
    NOOP = 0;
    PUT = 1;
    DELETE = 2;
  }

  Type type = 1;
  uint64 request_id = 2;
  string key = 3;
  string value = 4;
}

message LogEntry {
  uint64 term = 1;
  Command command = 2;
}

message RequestVote {
  uint64 term = 1;
  uint32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntries {
  uint64 term = 1;
  uint32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
}

message Envelope {
  uint64 message_id = 1;
  uint32 from = 2;
  uint32 to = 3;

  oneof payload {
    RequestVote request_vote = 10;
    RequestVoteResponse request_vote_response = 11;
    AppendEntries append_entries = 12;
    AppendEntriesResponse append_entries_response = 13;
  }
}

message DeliveryAck {
  bool accepted = 1;
  string error = 2;
}

service RaftTransport {
  rpc Deliver(Envelope) returns (DeliveryAck);
}
