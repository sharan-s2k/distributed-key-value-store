syntax = "proto3";

package raftkv.rpc;

message PutRequest {
  string key = 1;
  string value = 2;
  uint64 request_id = 3;
  uint32 timeout_ms = 4;
}

message DeleteRequest {
  string key = 1;
  uint64 request_id = 2;
  uint32 timeout_ms = 3;
}

message WriteResponse {
  bool committed = 1;
  bool is_leader = 2;
  uint32 leader_id = 3;
  string error = 4;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  string value = 2;
  bool is_leader = 3;
  uint32 leader_id = 4;
  string error = 5;
}

message StatusRequest {}

message StatusResponse {
  uint32 node_id = 1;
  string role = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  uint64 last_applied = 5;
  uint32 leader_id = 6;
}

service KeyValue {
  rpc Put(PutRequest) returns (WriteResponse);
  rpc Delete(DeleteRequest) returns (WriteResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}
